name: Publish Gellaria container

on:
  push:
    branches: [main]
    paths:
      - 'apps/gellaria/**'
      - 'packages/contracts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.dockerignore'
      - '.github/workflows/publish-gellaria.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gellaria-container-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/gellaria/Dockerfile
          push: true
          tags: ghcr.io/oneder2/gellaria:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
