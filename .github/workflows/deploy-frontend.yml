name: Workspace frontend deployment

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'tailwind.config.js'
      - 'postcss.config.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-frontend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package static build
        run: tar -czf workspace-frontend.tar.gz -C dist .
      - name: Upload static build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: workspace-frontend.tar.gz
          target: /tmp
      - name: Activate static release
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: RELEASE_SHA
          script: |
            set -euo pipefail
            FRONTEND_ROOT="$HOME/gworkspace/frontend"
            RELEASE_DIR="$FRONTEND_ROOT/releases/$RELEASE_SHA"
            mkdir -p "$RELEASE_DIR"
            tar -xzf /tmp/workspace-frontend.tar.gz -C "$RELEASE_DIR"
            test -f "$RELEASE_DIR/index.html"
            ln -sfn "$RELEASE_DIR" "$FRONTEND_ROOT/current-next"
            mv -Tf "$FRONTEND_ROOT/current-next" "$FRONTEND_ROOT/current"
            rm -f /tmp/workspace-frontend.tar.gz
            find "$FRONTEND_ROOT/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
              | sort -nr | tail -n +6 | cut -d' ' -f2- | xargs -r rm -rf
      - name: Cleanup package
        if: always()
        run: rm -f workspace-frontend.tar.gz
