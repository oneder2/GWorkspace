name: Workspace frontend deployment

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'tailwind.config.js'
      - 'postcss.config.js'
  workflow_dispatch:
    inputs:
      preview:
        description: 'Publish an isolated homepage preview instead of replacing production'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: workspace-frontend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_HOME_PREVIEW: ${{ inputs.preview && 'true' || 'false' }}
      VITE_PREVIEW_BASE: ${{ inputs.preview && '/previews/home-ascii/' || '/' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package static build
        run: tar -czf workspace-frontend.tar.gz -C dist .
      - name: Upload static build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: workspace-frontend.tar.gz
          target: /tmp
      - name: Activate static release
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELEASE_SHA: ${{ github.sha }}
          PREVIEW_MODE: ${{ inputs.preview && 'true' || 'false' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: RELEASE_SHA,PREVIEW_MODE
          script: |
            set -euo pipefail
            FRONTEND_ROOT="$HOME/gworkspace/frontend"
            if [ "$PREVIEW_MODE" = "true" ]; then
              test -f "$FRONTEND_ROOT/current/index.html"
              PREVIEW_DIR="$FRONTEND_ROOT/previews/$RELEASE_SHA"
              mkdir -p "$PREVIEW_DIR"
              tar -xzf /tmp/workspace-frontend.tar.gz -C "$PREVIEW_DIR"
              test -f "$PREVIEW_DIR/index.html"
              mkdir -p "$FRONTEND_ROOT/current/previews"
              ln -sfn "$PREVIEW_DIR" "$FRONTEND_ROOT/current/previews/home-ascii-next"
              mv -Tf "$FRONTEND_ROOT/current/previews/home-ascii-next" "$FRONTEND_ROOT/current/previews/home-ascii"
              rm -f /tmp/workspace-frontend.tar.gz
              echo "Preview published at /previews/home-ascii/"
              exit 0
            fi
            RELEASE_DIR="$FRONTEND_ROOT/releases/$RELEASE_SHA"
            mkdir -p "$RELEASE_DIR"
            tar -xzf /tmp/workspace-frontend.tar.gz -C "$RELEASE_DIR"
            test -f "$RELEASE_DIR/index.html"
            ln -sfn "$RELEASE_DIR" "$FRONTEND_ROOT/current-next"
            mv -Tf "$FRONTEND_ROOT/current-next" "$FRONTEND_ROOT/current"
            rm -f /tmp/workspace-frontend.tar.gz
            find "$FRONTEND_ROOT/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
              | sort -nr | tail -n +6 | cut -d' ' -f2- | xargs -r rm -rf
      - name: Cleanup package
        if: always()
        run: rm -f workspace-frontend.tar.gz
