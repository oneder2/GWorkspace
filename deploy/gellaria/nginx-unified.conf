map $http_upgrade $gellaria_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name gellaronline.cc www.gellaronline.cc;

    client_max_body_size 20m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gellaria is an optional GWorkspace experience, with an isolated realtime room.
    location = /ws/gellaria {
        proxy_pass http://127.0.0.1:4420;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gellaria_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location ^~ /explore {
        proxy_pass http://127.0.0.1:4420;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The Vue build remains the efficient work/admin shell.
    location ^~ /assets/ {
        root /home/deploy/gworkspace/frontend/current;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/(images|backgrounds)/ {
        root /home/deploy/gworkspace/frontend/current;
        try_files $uri =404;
        expires 30d;
    }

    location = /manifest.webmanifest {
        root /home/deploy/gworkspace/frontend/current;
        try_files $uri =404;
    }

    location = /sw.js {
        root /home/deploy/gworkspace/frontend/current;
        add_header Service-Worker-Allowed "/workspace/" always;
        try_files $uri =404;
    }

    location ~ ^/workbox-.*\.js$ {
        root /home/deploy/gworkspace/frontend/current;
        try_files $uri =404;
    }

    # GWorkspace remains the owner of every standard public and private route.
    location / {
        root /home/deploy/gworkspace/frontend/current;
        try_files $uri $uri/ /index.html;
    }
}
